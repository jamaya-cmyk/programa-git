<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil de usuario</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #F4ECD8;
    --tarjeta: #FBF6E9;
    --borde: #C9B68F;
    --texto: #4A3526;
    --marron: #8A7358;
    --avatar: #E2D3AE;
    --alerta: #A5502E;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: #e9e3d3;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .pantalla {
    width: 402px;
    max-width: 100%;
    min-height: 844px;
    background: var(--fondo);
    border: 1px solid #000;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
  }
  .statusbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 7px;
    padding: 20px 24px 19px;
    height: 61px;
  }
  .titulo {
    width: 349px;
    max-width: 100%;
    padding: 20px 0;
    font-size: 12px;
    color: var(--texto);
    text-align: center;
  }
  .contenido {
    width: 355px;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 5px;
    flex: 1;
  }
  .avatar { width: 153px; height: 148px; display: block; }
  .nombre {
    font-size: 20px;
    color: var(--marron);
    padding: 40px 0 20px;
    text-align: center;
  }
  .menu { display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 20px 0 0; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 10px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    color: var(--texto);
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .item svg { width: 24px; height: 24px; flex-shrink: 0; }
  .item:focus-visible, .nav button:focus-visible { outline: 2px solid var(--alerta); outline-offset: 2px; }
  .salir { border-color: var(--alerta); color: var(--alerta); margin-top: 20px; }
  .nav { width: 100%; }
  .nav hr { border: 0; border-top: 1px solid var(--borde); margin: 0 24px; }
  .nav div { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px 28px; }
  .nav button { background: none; border: 0; padding: 4px; cursor: pointer; display: flex; }
</style>
</head>
