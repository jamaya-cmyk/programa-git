<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrito - Aura Boutique</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #F4ECD8;
    --tarjeta: #FBF6E9;
    --borde: #C9B68F;
    --texto: #4A3526;
    --marron: #8A7358;
    --acento: #A5502E;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: #e9e3d3;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .pantalla {
    width: 402px;
    max-width: 100%;
    min-height: 844px;
    background: var(--fondo);
    border: 1px solid #000;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  .statusbar {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 7px;
    padding: 20px 24px 19px;
    height: 61px;
  }
  .titulo {
    width: 349px;
    max-width: 100%;
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 23px;
    color: var(--texto);
  }
  .titulo .seccion { font-size: 12px; text-align: center; }
  .titulo .marca { font-size: 20px; text-align: center; }

  .contenido {
    width: 350px;
    max-width: calc(100% - 20px);
    padding: 10px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .producto {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    height: 50px;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--texto);
  }
  .producto .precio, .resumen .valor { color: var(--acento); }
  .agregar {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 17px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font: inherit;
    font-size: 12px;
    color: var(--texto);
    opacity: .5;
    cursor: pointer;
    width: 100%;
    text-align: left;
  }
  .agregar:hover, .agregar:focus-visible { opacity: 1; }

  .resumen {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,.02);
    padding: 13px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 12px;
    color: var(--texto);
    margin-top: 10px;
  }
  .resumen div { display: flex; justify-content: space-between; align-items: center; }
  .resumen .etiqueta { opacity: .5; }

  .confirmar {
    align-self: center;
    margin-top: 10px;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,0,0,.02);
    padding: 9px 55px;
    font: inherit;
    font-size: 12px;
    color: #000;
    cursor: pointer;
  }
  .producto, .agregar, .confirmar { transition: none; }
  button:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  .nav { width: 100%; margin-top: 24px; }
  .nav hr { border: 0; border-top: 1px solid var(--borde); margin: 0 24px; }
  .nav div { display: flex; justify-content: space-between; align-items: center; padding: 22px 40px 28px; }
  .nav button { background: none; border: 0; padding: 4px; cursor: pointer; display: flex; }
</style>
</head>
